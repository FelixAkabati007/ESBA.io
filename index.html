          <div class="flex items-center justify-between">
            <div><h2 class="text-xl font-bold">${escapeHtml(title)}</h2><p class="text-sm text-slate-500">${items.length} records</p></div>
            <button class="btn-primary px-4 py-2 text-sm rounded-lg font-semibold">${escapeHtml(cta)}</button>
          </div>
          <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100">
            ${items
              .map(
                (i) => `
              <div class="p-4 flex items-center justify-between">
                <div class="font-semibold">${escapeHtml(i)}</div>
                <button class="text-xs text-brand-700 font-semibold">Edit</button>
              </div>
            `,
              )
              .join("")}
          </div>
        `;
        return el;
      }

      // ---------- Toast ----------
      function toast(msg) {
        const t = document.createElement("div");
        t.className =
          "fixed bottom-6 right-6 bg-slate-900 text-white px-4 py-2.5 rounded-lg shadow-lg text-sm font-semibold fade-in z-50";
        t.textContent = msg;
        document.body.appendChild(t);
        setTimeout(() => {
          t.style.opacity = "0";
          t.style.transition = "opacity .3s";
        }, 2000);
        setTimeout(() => t.remove(), 2400);
      }

      // ---------- Report Card ----------
      function openReportCard(studentId) {
        const s = STATE.students.find((x) => x.id === studentId);
        if (!s) return;
        const cls = STATE.classes.find((c) => c.id === s.classId);
        const reportSchool =
          STATE.schools.find((school) => school.id === STATE.currentSchoolId) ||
          STATE.schools.find(
            (school) => school.name === STATE.session.school,
          ) ||
          STATE.schools[0];
        const tpl = STATE.assessmentTemplate;
        const scale = STATE.gradingScale;
        const publishedSubjects = STATE.subjects
          .map((subject) => subject.id)
          .filter(
            (subjectId) =>
              STATE.publishedAssessments?.[`${s.classId}|${subjectId}|t1`],
          );
        const subjects = publishedSubjects.filter(
          (subjectId) =>
            scoreRecordErrors(STATE.scores[`${s.id}|${subjectId}|t1`], tpl)
              .length === 0,
        );
        if (!subjects.length)
          return toast(
            publishedSubjects.length
              ? "Published report data is incomplete. Ask the school to correct the scores."
              : "No report card has been published for this learner yet.",
          );

        const rows = subjects.map((sid) => {
          const sub = STATE.subjects.find((x) => x.id === sid);
          const r = computeClassResults(s.classId, sid, "t1", tpl, scale).find(
            (x) => x.student.id === s.id,
          );
          return { sub, ...r };
        });

        const avg = rows.reduce((a, r) => a + r.finalScore, 0) / rows.length;
        const overallGrade = gradeFor(avg, scale);

        const modal = document.createElement("div");
        modal.className =
          "fixed inset-0 z-50 modal-backdrop flex items-start justify-center p-4 overflow-y-auto";
        modal.innerHTML = `
          <div class="bg-white rounded-xl shadow-2xl w-full max-w-4xl my-6 fade-in">
            <div class="no-print flex items-center justify-between p-4 border-b border-slate-200">
              <div class="font-bold">Report Card Preview</div>
              <div class="flex gap-2">
                <button id="rc-print" class="btn-primary px-4 py-2 text-sm rounded-lg font-semibold">🖨️ Print</button>
                <button id="rc-close" class="px-4 py-2 text-sm rounded-lg border border-slate-200">Close</button>
              </div>
            </div>
            <div class="p-6 bg-slate-50">
              <div class="report-card bg-white shadow-md mx-auto" style="width:210mm; min-height:297mm; padding:14mm; font-size:11px; color:#0f1f4a;">
                <!-- Header -->
                <div style="display:flex; align-items:center; gap:12px; border-bottom:3px double #0f1f4a; padding-bottom:10px;">
                  <div style="width:60px;height:60px;border-radius:12px;background:#f5f7fb;display:flex;align-items:center;justify-content:center;overflow:hidden;flex-shrink:0;">${reportSchool.logoImage ? `<img src="${escapeHtml(reportSchool.logoImage)}" alt="${escapeHtml(reportSchool.name)} logo" style="width:100%;height:100%;object-fit:contain;" />` : `<span style="background:linear-gradient(135deg,#0f1f4a,#1447d1);color:#fcd116;width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:16px;">${escapeHtml(reportSchool.logo || "SCH")}</span>`}</div>
                  <div style="flex:1;">
                    <div style="font-size:18px;font-weight:900;letter-spacing:.5px;">${escapeHtml(reportSchool.name)}</div>
                    <div style="font-size:10px;color:#555;">${escapeHtml(reportSchool.address)} · ${escapeHtml(reportSchool.phone)} · ${escapeHtml(reportSchool.email)}</div>
                    <div style="font-size:11px;font-weight:700;color:#006b3f;margin-top:2px;">MOTT: "Knowledge · Discipline · Service"</div>
                  </div>
                </div>
                <div style="text-align:center;margin-top:8px;">
                  <div style="font-size:13px;font-weight:800;letter-spacing:2px;color:#1447d1;">LEARNER PROGRESS REPORT CARD</div>
                  <div style="font-size:10px;color:#555;">Academic Year 2026/2027 · Term 1</div>
                </div>

                <!-- Student info -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:4px 16px; margin-top:12px; padding:10px; background:#f5f7fb; border-radius:6px;">
                  <div><span style="color:#666;font-size:10px;">Name:</span> <b>${escapeHtml(s.firstName)} ${escapeHtml(s.middleName || "")} ${escapeHtml(s.lastName)}</b></div>
                  <div><span style="color:#666;font-size:10px;">Admission No:</span> <b>${escapeHtml(s.admissionNo)}</b></div>
                  <div><span style="color:#666;font-size:10px;">Class:</span> <b>${classLabel(cls)}</b></div>
                  <div><span style="color:#666;font-size:10px;">Student No:</span> <b>${escapeHtml(s.studentNo)}</b></div>
                  <div><span style="color:#666;font-size:10px;">Gender:</span> <b>${s.gender}</b></div>
                  <div><span style="color:#666;font-size:10px;">Date of Birth:</span> <b>${s.dob}</b></div>
                  <div><span style="color:#666;font-size:10px;">Number on Roll:</span> <b>${STATE.students.filter((x) => x.classId === s.classId).length}</b></div>
                  <div><span style="color:#666;font-size:10px;">Key Phase:</span> <b>${STATE.levels.find((l) => l.id === cls.levelId).phase}</b></div>
                </div>

                <!-- Results table -->
                <div style="margin-top:12px;">
                  <div style="font-weight:800;font-size:11px;margin-bottom:4px;color:#1447d1;">ACADEMIC PERFORMANCE</div>
                  <table style="width:100%; border-collapse:collapse; font-size:10px;">
                    <thead>
                      <tr style="background:#0f1f4a;color:#fcd116;">
                        <th style="padding:6px;text-align:left;border:1px solid #0f1f4a;">Subject</th>
                        ${tpl.components.map((component) => `<th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">${escapeHtml(component.name)} /${component.max}</th>`).join("")}
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Internal /${tpl.internalMax}</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Int. Scaled /${tpl.internalWeight}</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Exam /${tpl.examMax}</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Exam Scaled /${tpl.examWeight}</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Final /100</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Grade</th>
                        <th style="padding:6px;text-align:center;border:1px solid #0f1f4a;">Pos</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${rows
                        .map(
                          (r, i) => `
                        <tr style="background:${i % 2 ? "#f8fafc" : "#fff"};">
                          <td style="padding:5px;border:1px solid #d6dde8;font-weight:600;">${escapeHtml(r.sub.name)}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${r.it}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${r.gw}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${r.itk}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${r.pw}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;font-weight:700;">${r.internal}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${fmt(r.internalScaled)}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${r.exam}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;">${fmt(r.examScaled)}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;font-weight:800;">${fmt(r.finalScore)}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;font-weight:800;color:${r.grade <= 2 ? "#006b3f" : r.grade <= 3 ? "#1447d1" : r.grade <= 4 ? "#d89c00" : "#CE1126"};">${r.grade}</td>
                          <td style="padding:5px;text-align:center;border:1px solid #d6dde8;font-weight:800;">${r.position}</td>
                        </tr>
                      `,
                        )
                        .join("")}
                    </tbody>
                  </table>
                </div>

                <!-- Summary -->
                <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:12px;">
                  <div style="padding:10px; background:#f5f7fb; border-radius:6px;">
                    <div style="font-weight:800;font-size:11px;color:#1447d1;margin-bottom:6px;">SUMMARY</div>
                    <div style="display:flex;justify-content:space-between;font-size:10px;"><span>Total subjects:</span><b>${rows.length}</b></div>
                    <div style="display:flex;justify-content:space-between;font-size:10px;"><span>Average score:</span><b>${fmt(avg)} / 100</b></div>
                    <div style="display:flex;justify-content:space-between;font-size:10px;"><span>Overall grade:</span><b style="color:#006b3f;">${overallGrade.grade} — ${overallGrade.descriptor}</b></div>
                    <div style="display:flex;justify-content:space-between;font-size:10px;"><span>Class size:</span><b>${STATE.students.filter((x) => x.classId === s.classId).length}</b></div>
                  </div>
                  <div style="padding:10px; background:#f5f7fb; border-radius:6px;">
                    <div style="font-weight:800;font-size:11px;color:#1447d1;margin-bottom:6px;">ATTENDANCE</div>
                    <div style="font-size:10px;color:#555;">Attendance has not been recorded for this term.</div>
                  </div>
                </div>

                <!-- Competencies -->
                <div style="margin-top:12px; padding:10px; background:#f5f7fb; border-radius:6px;">
                  <div style="font-weight:800;font-size:11px;color:#1447d1;margin-bottom:6px;">CORE COMPETENCIES</div>
                  <div style="font-size:10px;color:#555;">Competency assessments have not been entered for this learner.</div>
                </div>

                <!-- Remarks -->
                <div style="margin-top:12px; display:grid; grid-template-columns:1fr; gap:12px;">
                  <div style="padding:10px; border:1px solid #d6dde8; border-radius:6px;">
                    <div style="font-size:10px;color:#666;">Automated academic summary</div>
                    <div style="font-style:italic;font-size:11px;margin-top:4px;">Calculated from ${rows.length} published subject results. Average: ${fmt(avg)} / 100. Overall grade: ${overallGrade.grade} — ${escapeHtml(overallGrade.descriptor)}.</div>
                    <div style="margin-top:8px;font-size:10px;color:#666;">Teacher and headteacher remarks have not been recorded.</div>
                  </div>
                </div>

                <!-- Footer / verification -->
                <div style="margin-top:14px; padding:10px; background:#0f1f4a; color:#fcd116; border-radius:6px; display:flex; justify-content:space-between; align-items:center;">
                  <div>
                    <div style="font-size:10px; opacity:.8;">Verification Code</div>
                    <div style="font-weight:900; font-size:14px; letter-spacing:1px;">ESBA-2026-9F72A81</div>
                    <div style="font-size:9px; opacity:.7;">esba.gh/verify/ESBA-2026-2026-9F72A81</div>
                  </div>
                  <div style="text-align:right;">
                    <div style="width:60px;height:60px;background:white;padding:4px;border-radius:4px;">
                      <svg viewBox="0 0 20 20" width="52" height="52">
                        ${generateQRPattern()}
                      </svg>
                    </div>
                  </div>
                </div>
                <div style="text-align:center; margin-top:8px; font-size:9px; color:#666;">
                  This is a computer-generated report. Powered by ESBA - GH · v0.1 · Aligned with NaCCA standards-based curriculum.
                </div>
              </div>
            </div>
          </div>
        `;
        document.body.appendChild(modal);
        $("#rc-close", modal).addEventListener("click", () => modal.remove());
        $("#rc-print", modal).addEventListener("click", () => {
          const w = window.open("", "_blank");
          w.document.write(
            `<html><head><title>Report Card — ${s.firstName} ${s.lastName}</title><style>body{margin:0;font-family:Inter,sans-serif;} @page{size:A4;margin:0;}</style></head><body>${modal.querySelector(".report-card").outerHTML}</body></html>`,
          );
          w.document.close();
          setTimeout(() => {
            w.print();
          }, 400);
        });
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.remove();
        });
      }

      function generateQRPattern() {
        // decorative pseudo-QR
        let rects = "";
        const size = 21;
        for (let y = 0; y < size; y++) {
          for (let x = 0; x < size; x++) {
            const corner =
              (x < 7 && y < 7) ||
              (x >= size - 7 && y < 7) ||
              (x < 7 && y >= size - 7);
            const fill = corner
              ? x === 0 ||
                x === 6 ||
                y === 0 ||
                y === 6 ||
                (x >= 2 && x <= 4 && y >= 2 && y <= 4)
                ? "#0f1f4a"
                : "transparent"
              : Math.random() < 0.45
                ? "#0f1f4a"
                : "transparent";
            if (fill !== "transparent")
              rects += `<rect x="${x}" y="${y}" width="1" height="1" fill="${fill}"/>`;
          }
        }
        return rects;
      }

      // ---------- Boot ----------
      // Keep dynamically-opened dialogs (appended to body) on-brand:
      // frosted navy glass matching the Figma concept chrome.
      const darkChromeObserver = new MutationObserver((mutations) => {
        for (const m of mutations) {
          for (const node of m.addedNodes) {
            if (!(node instanceof HTMLElement)) continue;
            const scope = node.classList.contains("modal-backdrop")
              ? node
              : node.querySelector(".modal-backdrop") || node;
            if (scope.classList.contains("report-card") || scope.closest(".report-card")) continue;
            if (scope.querySelector(".report-card")) continue; // report modal: keep print fidelity
            // Frosted dialog chrome for late-mounted modals & popovers
            scope.querySelectorAll('[role="dialog"].bg-white').forEach((el) => {
              el.classList.remove("bg-white");
              el.classList.add("dialog-glass");
            });
            scope.querySelectorAll(".bg-white\\/95").forEach((el) => {
              el.classList.remove("bg-white/95");
              el.classList.add("dialog-glass");
            });
            scope.querySelectorAll("section.bg-white, form.bg-white").forEach((el) => {
              if (el.matches('[role="dialog"]')) return;
              el.classList.remove("bg-white");
              el.classList.add("dialog-glass");
            });
            scope.querySelectorAll(".border-slate-100, .border-slate-200, .divide-slate-100").forEach((el) => {
              if (el.closest(".report-card")) return;
              el.classList.add("dark-hairline");
            });
            scope.querySelectorAll("button.border-slate-200, a.border-slate-200").forEach((el) => {
              if (el.closest(".report-card")) return;
              el.classList.add("btn-ghost-dark");
            });
            // Dropdown panels, popovers and any remaining light slabs mount
            // directly on body — give them the frosted relief too.
            scope.querySelectorAll(".bg-white.shadow-xl, .absolute.z-40.bg-white, .fixed .bg-white.rounded-2xl").forEach((el) => {
              if (el.classList.contains("report-card") || el.closest(".report-card")) return;
              el.classList.remove("bg-white");
              el.classList.add("glass-card");
            });
            scope
              .querySelectorAll(".hover\\:bg-slate-100, .hover\\:bg-slate-50")
              .forEach((el) => el.classList.add("hover-row-dark"));
            // Contrast contract: white/light surfaces → black ink,
            // dim/black surfaces → white ink, gold only on dim/black.
            enforceContrastContract(scope);
          }
        }
      });
      darkChromeObserver.observe(document.body, { childList: true, subtree: true });

      window.addEventListener("popstate", () => {
        const routeMatch = location.hash.match(/^#\/([^/]+)\/([^/?]+)/);
        if (STATE.session && routeMatch?.[1] === STATE.session.role) {
          STATE._route = routeMatch[2];
          STATE._params = {};
          save("state", STATE);
        }
        renderApp();
      });
      renderApp();
    </script>
  </body>
</html>
