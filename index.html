    <style>
      body {
        font-family: "Inter", sans-serif;
        background: #f5f7fb;
      }
      .scrollbar-thin::-webkit-scrollbar {
        width: 6px;
        height: 6px;
      }
      .scrollbar-thin::-webkit-scrollbar-thumb {
        background: #c7d2e0;
        border-radius: 3px;
      }
      .scrollbar-thin::-webkit-scrollbar-track {
        background: transparent;
      }
      .fade-in {
        animation: fadeIn 0.35s ease both;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .sidebar-link.active {
        background: #eef6ff;
        color: #1447d1;
        border-left-color: #1447d1;
      }
      .sidebar-link:hover {
        background: #f3f6fb;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          background: white;
        }
        .report-card {
          box-shadow: none !important;
        }
      }
      .report-card {
        font-family: "Inter", sans-serif;
      }
      .grade-A {
        color: #006b3f;
        font-weight: 700;
      }
      .grade-B {
        color: #1447d1;
        font-weight: 700;
      }
      .grade-C {
        color: #d89c00;
        font-weight: 700;
      }
      .grade-D {
        color: #ce1126;
        font-weight: 700;
      }
      .stat-card {
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .stat-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -10px rgba(20, 71, 209, 0.25);
      }
      .btn-primary {
        background: #1447d1;
        color: white;
      }
      .btn-primary:hover {
        background: #173682;
      }
      .input {
        border: 1px solid #d6dde8;
        border-radius: 8px;
        padding: 8px 12px;
        width: 100%;
        font-size: 14px;
        outline: none;
        transition:
          border 0.15s,
          box-shadow 0.15s;
      }
      .input:focus {
        border-color: #1447d1;
        box-shadow: 0 0 0 3px rgba(20, 71, 209, 0.12);
      }
      .badge {
        display: inline-flex;
        align-items: center;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 600;
      }
      .table-row:hover {
        background: #f8fafc;
      }
      .modal-backdrop {
        background: rgba(15, 31, 74, 0.55);
        -webkit-backdrop-filter: blur(3px);
        backdrop-filter: blur(3px);
      }
      .dialog-enter {
        animation: dialogEnter 0.2s ease-out both;
      }
      /* Responsive hardening */
      body {
        -webkit-text-size-adjust: 100%;
      }
      #page-content {
        width: 100%;
        max-width: 1680px;
        margin-inline: auto;
      }
      #page-content .overflow-hidden:has(> table) {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
      @media (max-width: 1023px) {
        input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):not(
            [type="range"]
          ),
        select,
        textarea {
          font-size: 16px !important;
        }
      }
      @media (pointer: coarse) {
        #page-content button,
        header button,
        header a {
          min-height: 40px;
        }
        .sidebar-link {
          min-height: 44px;
        }
        input[type="checkbox"],
        input[type="radio"] {
          width: 1.25rem;
          height: 1.25rem;
        }
      }
      [role="dialog"] {
        max-width: 100%;
        max-height: calc(100dvh - 0.5rem);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .modal-backdrop {
        overscroll-behavior: contain;
      }
      @media (max-width: 640px) {
        [role="dialog"] {
          border-radius: 1rem 1rem 0 0;
        }
      }

      /* =========================================================
         LUXURY EDU DESIGN SYSTEM — glassmorphism, embossed depth,
         custom SVG iconography and keyframe animations.
         Inspired by the "Educational App || Mobile app Concept"
         Figma community design: deep navy canvas, gold accents,
         soft frosted cards with layered light/shadow relief.
      ========================================================= */
      :root {
        --edu-glass: rgba(255, 255, 255, 0.72);
        --edu-glass-strong: rgba(255, 255, 255, 0.86);
        --edu-glass-border: rgba(255, 255, 255, 0.65);
        --edu-gold: #fcd116;
        --edu-aurora: radial-gradient(
            60rem 30rem at 8% -10%,
            rgba(20, 71, 209, 0.1),
            transparent 60%
          ),
          radial-gradient(
            50rem 26rem at 110% 8%,
            rgba(252, 209, 22, 0.12),
            transparent 55%
          ),
          radial-gradient(
            40rem 30rem at 50% 120%,
            rgba(0, 107, 63, 0.08),
            transparent 60%
          );
      }
      body {
        background-color: #eef2fa;
        background-image: var(--edu-aurora);
        background-attachment: fixed;
      }
      /* Glass card */
      .glass-card {
        background: linear-gradient(
          160deg,
          var(--edu-glass-strong),
          var(--edu-glass)
        );
        -webkit-backdrop-filter: blur(14px) saturate(1.4);
        backdrop-filter: blur(14px) saturate(1.4);
        border: 1px solid var(--edu-glass-border);
        border-radius: 1.25rem;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.9) inset,
          0 -1px 0 rgba(15, 31, 74, 0.04) inset,
          0 12px 32px -12px rgba(15, 31, 74, 0.18),
          0 2px 6px rgba(15, 31, 74, 0.05);
        transition: transform 0.25s ease, box-shadow 0.25s ease,
          border-color 0.25s ease;
      }
      .glass-card:hover {
        transform: translateY(-2px);
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.95) inset,
          0 18px 44px -14px rgba(15, 31, 74, 0.26),
          0 4px 10px rgba(15, 31, 74, 0.07);
      }
      /* Embossed container with sculpted depth */
      .embossed {
        background: linear-gradient(180deg, #ffffff 0%, #f6f9fe 100%);
        border: 1px solid rgba(15, 31, 74, 0.08);
        border-radius: 1.25rem;
        box-shadow: 6px 6px 18px rgba(15, 31, 74, 0.1),
          -6px -6px 18px rgba(255, 255, 255, 0.9),
          inset 1px 1px 0 rgba(255, 255, 255, 1),
          inset -1px -1px 0 rgba(15, 31, 74, 0.04);
      }
      .embossed-inset {
        background: linear-gradient(180deg, #eef2fa 0%, #f8fafd 100%);
        box-shadow: inset 3px 3px 8px rgba(15, 31, 74, 0.1),
          inset -3px -3px 8px rgba(255, 255, 255, 0.95);
        border-radius: 0.9rem;
      }
      /* Gold shimmer sweep for premium CTAs & headers */
      .gold-shimmer {
        position: relative;
        overflow: hidden;
      }
      .gold-shimmer::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          115deg,
          transparent 30%,
          rgba(252, 209, 22, 0.28) 48%,
          rgba(255, 255, 255, 0.35) 52%,
          transparent 70%
        );
        transform: translateX(-120%);
        animation: eduSweep 5.5s ease-in-out infinite;
        pointer-events: none;
      }
      @keyframes eduSweep {
        0%,
        55% {
          transform: translateX(-120%);
        }
        85%,
        100% {
          transform: translateX(120%);
        }
      }
      /* Floating hero ornaments */
      .float-slow {
        animation: eduFloat 7s ease-in-out infinite;
      }
      .float-slower {
        animation: eduFloat 10s ease-in-out 1.2s infinite;
      }
      @keyframes eduFloat {
        0%,
        100% {
          transform: translateY(0) rotate(0deg);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
      }
      /* Glowing ring pulse (live/system status) */
      .edu-pulse {
        position: relative;
      }
      .edu-pulse::before {
        content: "";
        position: absolute;
        inset: -4px;
        border-radius: 9999px;
        background: rgba(0, 107, 63, 0.35);
        animation: eduPulse 2.2s ease-out infinite;
        z-index: -1;
      }
      @keyframes eduPulse {
        0% {
          transform: scale(0.8);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.9);
          opacity: 0;
        }
      }
      /* Animated gradient text */
      .edu-gradient-text {
        background: linear-gradient(
          100deg,
          #0f1f4a 15%,
          #1447d1 45%,
          #d89c00 70%,
          #0f1f4a 95%
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: eduTextFlow 8s linear infinite;
      }
      @keyframes eduTextFlow {
        to {
          background-position: -220% 0;
        }
      }
      /* Staggered entrance for grids/lists */
      .stagger-in > * {
        animation: riseIn 0.45s cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      .stagger-in > *:nth-child(1) { animation-delay: 0.03s; }
      .stagger-in > *:nth-child(2) { animation-delay: 0.07s; }
      .stagger-in > *:nth-child(3) { animation-delay: 0.11s; }
      .stagger-in > *:nth-child(4) { animation-delay: 0.15s; }
      .stagger-in > *:nth-child(5) { animation-delay: 0.19s; }
      .stagger-in > *:nth-child(6) { animation-delay: 0.23s; }
      .stagger-in > *:nth-child(7) { animation-delay: 0.27s; }
      .stagger-in > *:nth-child(8) { animation-delay: 0.31s; }
      .stagger-in > *:nth-child(n + 9) { animation-delay: 0.35s; }
      @keyframes riseIn {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Custom SVG icon chip */
      .icon-chip {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 2.5rem;
        height: 2.5rem;
        flex-shrink: 0;
        border-radius: 0.85rem;
        color: #1447d1;
        background: linear-gradient(180deg, #ffffff, #eaf1ff);
        border: 1px solid rgba(15, 31, 74, 0.08);
        box-shadow: 3px 3px 8px rgba(15, 31, 74, 0.12),
          -3px -3px 8px rgba(255, 255, 255, 0.95),
          inset 1px 1px 0 #fff;
      }
      .icon-chip svg {
        width: 1.35rem;
        height: 1.35rem;
      }
      .icon-chip.gold {
        color: #92600a;
        background: linear-gradient(180deg, #fff8e1, #fdeec2);
      }
      .icon-chip.green {
        color: #006b3f;
        background: linear-gradient(180deg, #e9fbf2, #d2f2e2);
      }
      .icon-chip.red {
        color: #b3121f;
        background: linear-gradient(180deg, #fdecec, #fbd9dc);
      }
      .icon-chip.navy {
        color: #fcd116;
        background: linear-gradient(160deg, #163ba6, #0f1f4a);
        border-color: rgba(15, 31, 74, 0.35);
      }
      /* Sidebar glass rail with active glow bar */
      .sidebar-link.active {
        background: linear-gradient(90deg, #eef6ff, rgba(252, 209, 22, 0.12));
        color: #1447d1;
        border-left-color: #1447d1;
        box-shadow: inset 0 0 0 1px rgba(20, 71, 209, 0.08),
          0 4px 12px -4px rgba(20, 71, 209, 0.25);
      }
      .sidebar-link.active svg {
        filter: drop-shadow(0 0 6px rgba(20, 71, 209, 0.45));
      }
      /* Table header gilded underline */
      table thead tr {
        position: relative;
      }
      table thead::after {
        content: "";
        display: block;
        height: 2px;
        background: linear-gradient(90deg, #1447d1, #fcd116, transparent);
      }
      /* Progress meter shimmer fill */
      .meter-fill {
        background-image: linear-gradient(
          90deg,
          rgba(255, 255, 255, 0.35),
          transparent 40%
        );
        animation: eduTextFlow 3s linear infinite;
        background-size: 220% 100%;
      }
      @media (prefers-reduced-motion: reduce) {
        .gold-shimmer::after,
        .float-slow,
        .float-slower,
        .edu-pulse::before,
        .edu-gradient-text,
        .stagger-in > *,
        .meter-fill {
          animation: none !important;
        }
        .glass-card:hover {
          transform: none;
        }
      }
      @keyframes heroZoom {
        from {
          transform: scale(1.02) translate3d(0, 0, 0);
        }
        to {
          transform: scale(1.12) translate3d(-1.5%, -1%, 0);
        }
      }
      @keyframes heroIn {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes heroBar {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      .hero-zoom {
        animation: heroZoom 26s ease-in-out infinite alternate;
        will-change: transform;
      }
      .hero-wrap {
        display: grid;
      }
      .hero-slide {
        grid-area: 1 / 1;
        visibility: hidden;
      }
      .hero-slide.is-active {
        visibility: visible;
      }
      .hero-slide.is-active > * {
        animation: heroIn 0.75s cubic-bezier(0.2, 0.8, 0.2, 1) both;
      }
      .hero-slide.is-active > *:nth-child(2) {
        animation-delay: 0.12s;
      }
      .hero-slide.is-active > *:nth-child(3) {
        animation-delay: 0.24s;
      }
      .hero-slide.is-active > *:nth-child(4) {
        animation-delay: 0.36s;
      }
      .hero-dot i {
        display: block;
        height: 100%;
        transform-origin: left;
        transform: scaleX(0);
        background: #f5b301;
      }
      .hero-dot.is-done i {
        transform: scaleX(1);
      }
      .hero-dot.is-active i {
        animation: heroBar var(--hero-ms, 7000ms) linear forwards;
      }
      .hero-paused .hero-dot.is-active i {
        animation-play-state: paused;
      }
      @keyframes dialogEnter {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.99);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .edu-action {
        transition:
          transform 0.16s ease,
          box-shadow 0.16s ease,
          background-color 0.16s ease;
      }
      .edu-action:hover {
        transform: translateY(-1px);
        box-shadow: 0 6px 16px -8px rgba(20, 71, 209, 0.55);
      }
      .edu-action:active {
        transform: translateY(0);
      }
      :focus-visible {
        outline: 3px solid rgba(245, 179, 1, 0.85);
        outline-offset: 2px;
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
      #page-content {
        min-width: 0;
      }
      @media (max-width: 640px) {
        .report-card {
          width: 100% !important;
          min-height: 0 !important;
          padding: 16px !important;
          font-size: 10px !important;
          overflow-x: auto;
        }
        .modal-backdrop {
          padding: 8px;
        }
      }

      /* =========================================================
         FIGMA CONCEPT ALIGNMENT — dark navy aurora canvas,
         frosted glass chrome, gold reliefs (Educational App
         || Mobile app Concept, node 12-598)
      ========================================================= */
      :root {
        --edu-navy-1: #060c1f;
        --edu-navy-2: #0b1437;
        --edu-navy-3: #122052;
        --edu-gold-soft: rgba(252, 209, 22, 0.16);
      }
      body {
        background-color: var(--edu-navy-1);
        background-image:
          radial-gradient(60rem 32rem at 10% -12%, rgba(20, 71, 209, 0.38), transparent 60%),
          radial-gradient(52rem 28rem at 112% 6%, rgba(252, 209, 22, 0.14), transparent 55%),
          radial-gradient(44rem 34rem at 50% 120%, rgba(0, 107, 63, 0.28), transparent 60%),
          linear-gradient(180deg, var(--edu-navy-1) 0%, var(--edu-navy-2) 55%, var(--edu-navy-1) 100%);
      }
      .aurora-orb {
        position: fixed;
        border-radius: 9999px;
        pointer-events: none;
        filter: blur(70px);
        z-index: 0;
      }
      .aurora-orb.orb-blue {
        width: 34rem; height: 34rem; left: -10rem; top: -8rem;
        background: radial-gradient(circle, rgba(59, 130, 246, 0.22), transparent 70%);
        animation: orbDrift 18s ease-in-out infinite alternate;
      }
      .aurora-orb.orb-gold {
        width: 26rem; height: 26rem; right: -8rem; top: 22%;
        background: radial-gradient(circle, rgba(252, 209, 22, 0.14), transparent 70%);
        animation: orbDrift 24s ease-in-out -6s infinite alternate-reverse;
      }
      @keyframes orbDrift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to   { transform: translate3d(3rem, 4rem, 0) scale(1.12); }
      }
      .app-shell-dark { background: transparent !important; }
      /* Frosted glass rail + bar */
      .glass-rail {
        background: linear-gradient(180deg, rgba(15, 26, 58, 0.82), rgba(8, 15, 38, 0.9));
        -webkit-backdrop-filter: blur(20px) saturate(1.35);
        backdrop-filter: blur(20px) saturate(1.35);
        border-right: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow: 1px 0 0 rgba(255, 255, 255, 0.04) inset, 12px 0 40px -20px rgba(0, 0, 0, 0.7);
      }
      .glass-bar {
        background: linear-gradient(180deg, rgba(15, 26, 58, 0.72), rgba(10, 18, 44, 0.82));
        -webkit-backdrop-filter: blur(16px) saturate(1.3);
        backdrop-filter: blur(16px) saturate(1.3);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08) !important;
        box-shadow: 0 1px 0 rgba(255, 255, 255, 0.05) inset, 0 14px 34px -20px rgba(0, 0, 0, 0.65);
      }
      /* Dark sidebar links with gold active relief */
      .sidebar-link { color: rgba(226, 232, 240, 0.72) !important; border-left-color: transparent; }
      .sidebar-link:hover { background: rgba(255, 255, 255, 0.06) !important; color: #fff !important; }
      .sidebar-link.active {
        background: linear-gradient(90deg, rgba(20, 71, 209, 0.35), rgba(252, 209, 22, 0.1)) !important;
        color: #fff !important;
        border-left-color: var(--edu-gold) !important;
        box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.12), 0 6px 18px -8px rgba(20, 71, 209, 0.6);
      }
      .sb-caption { color: rgba(226, 232, 240, 0.5) !important; }
      .sb-name { color: #e2e8f0 !important; }
      .sb-sub { color: rgba(226, 232, 240, 0.55) !important; }
      .sb-divider { border-color: rgba(255, 255, 255, 0.08) !important; }
      .crumb-parent { color: rgba(226, 232, 240, 0.55) !important; }
      .crumb-page { color: #f1f5f9 !important; }
      /* Embossed page cards that pop against the navy canvas */
      .page-card {
        background: linear-gradient(165deg, rgba(255, 255, 255, 0.96), rgba(240, 245, 253, 0.92));
        -webkit-backdrop-filter: blur(10px);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.6) !important;
        border-radius: 1rem;
        box-shadow:
          inset 0 1px 0 rgba(255, 255, 255, 0.95),
          inset 0 -1px 0 rgba(15, 31, 74, 0.06),
          0 18px 40px -18px rgba(2, 6, 23, 0.55),
          0 4px 12px rgba(2, 6, 23, 0.35);
      }
      .stat-card {
        background: linear-gradient(160deg, rgba(255, 255, 255, 0.97), rgba(238, 244, 253, 0.9));
        border: 1px solid rgba(255, 255, 255, 0.55) !important;
        box-shadow:
          inset 0 1px 0 #fff,
          inset 0 -1px 0 rgba(15, 31, 74, 0.05),
          0 14px 30px -14px rgba(2, 6, 23, 0.5),
          0 3px 8px rgba(2, 6, 23, 0.32);
      }
      .stat-card:hover {
        transform: translateY(-3px);
        box-shadow:
          inset 0 1px 0 #fff,
          0 22px 44px -16px rgba(2, 6, 23, 0.6),
          0 6px 14px rgba(2, 6, 23, 0.4),
          0 0 0 1px rgba(252, 209, 22, 0.35);
      }
      /* Hero-style welcome banner shared by dashboards */
      .hero-banner {
        background: linear-gradient(120deg, #163ba6 0%, #0f1f4a 55%, #0a1330 100%);
        border: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.18), 0 24px 50px -20px rgba(2, 6, 23, 0.75);
      }
      .hero-banner::before {
        content: "";
        position: absolute;
        inset: 0;
        background:
          radial-gradient(24rem 12rem at 88% -20%, rgba(252, 209, 22, 0.22), transparent 60%),

      /* Rule 3 — strip gold/amber/yellow ink from any light surface. */

      // ---------- Calculation Engine ----------
      const SCORE_KEYS = ["it", "gw", "itk", "pw", "exam"];
      function scoreMaximums(tpl) {
        return {
          it: Number(tpl.components[0]?.max) || 0,
          gw: Number(tpl.components[1]?.max) || 0,
          itk: Number(tpl.components[2]?.max) || 0,
          pw: Number(tpl.components[3]?.max) || 0,
          exam: Number(tpl.examMax) || 0,
        };
      }
      function scoreRecordErrors(scores, tpl) {
        if (!scores || typeof scores !== "object") return SCORE_KEYS;
        const maximums = scoreMaximums(tpl);
        return SCORE_KEYS.filter((key) => {
          const value = scores[key];
          return (
            typeof value !== "number" ||
            !Number.isFinite(value) ||
            value < 0 ||
            value > maximums[key] ||
            Math.abs(value * 100 - Math.round(value * 100)) > 1e-7
          );
        });
      }
      function calcRow(scores, tpl) {
        const maximums = scoreMaximums(tpl);
        const safeScore = (key) => {
          const value = Number(scores?.[key]);
          if (!Number.isFinite(value)) return 0;
          return Math.min(maximums[key], Math.max(0, value));
        };
        const it = safeScore("it");
        const gw = safeScore("gw");
        const itk = safeScore("itk");
        const pw = safeScore("pw");
        const exam = safeScore("exam");
        const internal = roundScore(it + gw + itk + pw);
        const internalScaled =
          tpl.internalMax > 0
            ? roundScore((internal / tpl.internalMax) * tpl.internalWeight)
            : 0;
        const examScaled =
          tpl.examMax > 0
            ? roundScore((exam / tpl.examMax) * tpl.examWeight)
            : 0;
        const finalScore = roundScore(internalScaled + examScaled);
        return {
          it,
          gw,
          itk,
          pw,
          internal,
          internalScaled,
          exam,
          examScaled,
          finalScore,
        };
      }
      function gradeFor(score, scale) {
        const normalizedScore = roundScore(score);
        return (
          scale.find(
            (g) => normalizedScore >= g.min && normalizedScore <= g.max,
          ) || scale[scale.length - 1]
        );
      }
      function computeClassResults(classId, subjectId, termId, tpl, scale) {
        const students = STATE.students.filter(
          (s) => s.classId === classId && s.status === "ACTIVE",
        );
        const rows = students.map((s) => {
          const savedScores =
            STATE.scores[`${s.id}|${subjectId}|${termId}`] || null;
          let verdict = { ok: false, issues: ["No scores entered."] };
          try {
            if (savedScores) verdict = verifyCalculation(savedScores, tpl);
          } catch (error) {
            reportCalcFailure(`class results ${classId}/${subjectId}`, error);
            verdict = { ok: false, issues: [error.message] };
          }
          const c = calcRow(savedScores || {}, tpl);
          const g = gradeFor(c.finalScore, scale);
          return {
            student: s,
            ...c,
            grade: g.grade,
            descriptor: g.descriptor,
            remark: g.remark,
            hasScore: Boolean(savedScores),
            isComplete: verdict.ok,
            hasInvalidScores: Boolean(savedScores) && !verdict.ok,
            calcIssues: verdict.issues,
            position: null,
          };
        });
        const ranked = rows.filter((row) => row.isComplete);
        const ranks = competitionRanks(ranked.map((row) => row.finalScore));
        ranked.forEach((row, index) => {
          row.position = ranks[index];
        });
        return rows;
      }
      function summarizeResults(rows) {
        const finals = rows
          .filter((r) => r.isComplete)
          .map((r) => r.finalScore);
        return {
          learners: rows.length,
          complete: finals.length,
          average: finals.length
            ? roundScore(finals.reduce((a, b) => a + b, 0) / finals.length)
            : null,
          highest: finals.length ? Math.max(...finals) : null,
          lowest: finals.length ? Math.min(...finals) : null,
        };
      }
      // Cumulative check: no learner total, class average or rank may exceed its bounds.
      function verifyClassAggregate(rows, tpl) {
        const issues = [];
        const maxTotal = Number(tpl.internalWeight) + Number(tpl.examWeight);
        const complete = rows.filter((r) => r.isComplete);
        complete.forEach((r) => {
          const name = `${r.student.firstName} ${r.student.lastName}`;
          if (r.finalScore > maxTotal + 0.001)
            issues.push(
              `${name}: total ${fmt(r.finalScore)} exceeds ${maxTotal}.`,
            );
          if (r.position < 1 || r.position > complete.length)
            issues.push(`${name}: rank is outside the class range.`);
        });
        const summary = summarizeResults(rows);
        if (summary.average !== null && summary.average > maxTotal + 0.001)
          issues.push(
            `Class average ${fmt(summary.average)} exceeds ${maxTotal}.`,
          );
        return { ok: issues.length === 0, issues, summary };
      }
      function canEditScores(session, classId, subjectId, state = STATE) {
        if (!session || session.role !== "TEACHER" || !session.teacherId)
          return false;
        const teacher = state.teachers.find((t) => t.id === session.teacherId);
        return Boolean(
          teacher?.assigned.some(
            (a) => a.classId === classId && a.subjectId === subjectId,
          ),
        );
      }
      function scoreSetLockState(classId, subjectId, termId, state = STATE) {
        const key = `${classId}|${subjectId}|${termId}`;
        if (state.publishedAssessments?.[key])
          return { locked: true, reason: "published" };
        const sub = (state.submissions || []).find((i) => i.key === key);
        if (sub && ["SUBMITTED", "APPROVED"].includes(sub.status))
          return { locked: true, reason: "submitted" };
        return { locked: false, reason: "" };
      }
      function logScoreAudit(entry) {
        const now = Date.now();
        const user = STATE.session?.name || "system";
        if (entry.coalesceKey) {
          const existing = STATE.scoreAudit
            .slice(0, 50)
            .find(
              (i) =>
                i.coalesceKey === entry.coalesceKey &&

          revision: STATE.scoreRevision || 0,

      function reportCalcFailure(context, error) {

      const storedRevision = () =>

      function persistScoreChange({
        studentId,
        classId,
        subjectId,
        termId,
        key,
        value,
      }) {
        const tpl = STATE.assessmentTemplate;
        const base = { classId, subjectId, termId, studentId, field: key };
        if (!canEditScores(STATE.session, classId, subjectId)) {
          logScoreAudit({
            ...base,
            action: "ACCESS_DENIED",
            detail: "Score write attempted without teacher authorisation.",
          });
          save("state", STATE);
          return {
            ok: false,
            error:
              "Only the teacher assigned to this class and subject can edit these scores.",
          };
        }
        const student = STATE.students.find(
          (s) =>
            s.id === studentId &&
            s.classId === classId &&
            s.status === "ACTIVE",
        );
        if (!student || !SCORE_KEYS.includes(key))
          return {
            ok: false,
            error:
              "That entry does not belong to an active learner in this class.",
          };
        const problems = templateIssues(tpl);
        if (problems.length) {
          reportCalcFailure(
            "template integrity",
            new Error(problems.join(" ")),
          );
          return {
            ok: false,
            error:
              "The scoring template is invalid, so scores cannot be saved.",
          };
        }
        const checked = validateScoreValue(key, value, tpl);
        if (!checked.ok) {
          logScoreAudit({
            ...base,
            action: "SCORE_REJECTED",
            coalesceKey: `rej|${studentId}|${key}`,
            attempted: String(value),
            reason: checked.error,
          });
          save("state", STATE);
          return { ok: false, error: checked.error };
        }
        const lock = scoreSetLockState(classId, subjectId, termId);
        if (lock.locked)
          return {
            ok: false,
            error: `These scores are ${lock.reason}. Unlock them before editing.`,
          };
        if (storedRevision() > (STATE.scoreRevision || 0))
          return {
            ok: false,
            error:
              "These scores were changed in another tab or session. Reload this page before editing so newer data is not overwritten.",
          };
        const scoreKey = `${studentId}|${subjectId}|${termId}`;
        const before = STATE.scores[scoreKey]
          ? { ...STATE.scores[scoreKey] }
          : null;
        const next = {
          it: null,
          gw: null,
          itk: null,
          pw: null,
          exam: null,
          ...(before || {}),
          [key]: checked.value,
        };
        STATE.scores[scoreKey] = next;
        STATE.scoreRevision = (STATE.scoreRevision || 0) + 1;
        let outputs = null;
        try {
          const verdict = verifyCalculation(next, tpl);
          if (verdict.ok)
            outputs = {
              internal: verdict.calc.internal,
              internalScaled: verdict.calc.internalScaled,
              examScaled: verdict.calc.examScaled,
              final: verdict.calc.finalScore,
              grade: gradeFor(verdict.calc.finalScore, STATE.gradingScale)
                .grade,
            };
          logScoreAudit({
            ...base,
            action: "SCORE_EDIT",
            coalesceKey: `edit|${scoreKey}|${key}`,
            from: before?.[key] ?? null,
            to: checked.value,
            outputs,
            issues: verdict.issues,
          });
          save("state", STATE);
        } catch (error) {
          if (before) STATE.scores[scoreKey] = before;
          else delete STATE.scores[scoreKey];
          STATE.scoreRevision -= 1;
          reportCalcFailure("saving score", error);
          return {
            ok: false,
            error:
              "The score could not be saved; the previous value was restored.",
          };
        }
        return { ok: true, record: next, outputs };
      }
      function unlockScoreSet(classId, subjectId, termId) {
        if (!canEditScores(STATE.session, classId, subjectId))
          return { ok: false, error: "Not authorised." };
        const key = `${classId}|${subjectId}|${termId}`;
        const sub = STATE.submissions.find((i) => i.key === key);
        const wasPublished = Boolean(STATE.publishedAssessments[key]);
        if (sub) {
          sub.status = "DRAFT";
          sub.submittedAt = null;
          sub.updatedAt = new Date().toISOString();
        }
        delete STATE.publishedAssessments[key];
        STATE.scoreRevision = (STATE.scoreRevision || 0) + 1;
        logScoreAudit({
          action: "UNLOCK_FOR_EDIT",
          classId,
          subjectId,
          termId,
          detail: wasPublished
            ? "Published results were withdrawn so scores can be corrected."
            : "Submission returned to draft.",
        });
        save("state", STATE);
        return { ok: true };
      }
      function validateScoreValue(key, raw, tpl) {
        const label = SCORE_LABELS[key];
        const max = scoreMaximums(tpl)[key];
        const text = String(raw ?? "").trim();
        if (text === "") return { ok: true, value: null };
        if (/^-\s*[0-9.]/.test(text))
          return {
            ok: false,
            error: `${label} cannot be negative. Enter a value from 0 to ${max}.`,
          };
        if (!/^[0-9]+(\.[0-9]{1,2})?$/.test(text))
          return {
            ok: false,
            error: `${label} must be a number from 0 to ${max} with at most 2 decimal places.`,
          };
        if (Number(text) > max)
          return {
            ok: false,
            error: `${label} cannot exceed ${max} marks. Enter a value from 0 to ${max}.`,
          };
        return { ok: true, value: Number(text) };
      }
      const SCORE_LABELS = {
        it: "Individual Test",
        gw: "Group Work",
        itk: "Individual Task",
        pw: "Project Work",
        exam: "Examination",
      };
      function templateIssues(tpl) {
        if (!tpl || !Array.isArray(tpl.components) || tpl.components.length < 4)
          return [
            "The assessment template must define four internal components.",
          ];
        const issues = [];
        const maxima = scoreMaximums(tpl);
        SCORE_KEYS.forEach((key) => {
          if (!Number.isInteger(maxima[key]) || maxima[key] <= 0)
            issues.push(
              `${SCORE_LABELS[key]} maximum must be a positive whole number.`,
            );
        });
        const total = maxima.it + maxima.gw + maxima.itk + maxima.pw;
        if (total !== Number(tpl.internalMax))
          issues.push(
            `Component maximums total ${total} but the internal maximum is ${tpl.internalMax}.`,
          );
        const weights = Number(tpl.internalWeight) + Number(tpl.examWeight);
        if (weights !== 100)
          issues.push(
            `Internal and exam weights total ${weights}%; they must total 100%.`,
          );
        return issues;
      }
      // Independent recomputation from raw marks so a faulty total cannot pass silently.
      function verifyCalculation(scores, tpl) {
        const issues = templateIssues(tpl);
        const invalid = scoreRecordErrors(scores, tpl);
        if (invalid.length)
          issues.push(
            `Missing or invalid: ${invalid.map((k) => SCORE_LABELS[k]).join(", ")}.`,
          );
        if (issues.length) return { ok: false, issues, calc: null };
        const calc = calcRow(scores, tpl);
        const raw = scores.it + scores.gw + scores.itk + scores.pw;
        const expected =
          (raw / tpl.internalMax) * tpl.internalWeight +
          (scores.exam / tpl.examMax) * tpl.examWeight;
        if (Math.abs(calc.internal - raw) > 0.005)
          issues.push(
            "Internal total does not equal the sum of its components.",
          );
        if (calc.internal > tpl.internalMax)
          issues.push("Internal total exceeds the internal maximum.");
        if (calc.internalScaled > tpl.internalWeight + 0.005)
          issues.push("Scaled internal score exceeds the internal weight.");
        if (calc.examScaled > tpl.examWeight + 0.005)
          issues.push("Scaled exam score exceeds the exam weight.");
        if (calc.finalScore < 0 || calc.finalScore > 100.005)
          issues.push(`Final total ${fmt(calc.finalScore)} is outside 0–100.`);
        if (Math.abs(calc.finalScore - expected) > 0.011)
          issues.push(
            `Calculated total ${fmt(calc.finalScore)} differs from expected ${fmt(expected)}.`,
          );
        return { ok: issues.length === 0, issues, calc };
      }
      function competitionRanks(values) {
        const order = values
          .map((value, index) => ({ value: roundScore(value), index }))
          .sort((a, b) => b.value - a.value);
        const ranks = new Array(values.length);
        let rank = 1;
        order.forEach((entry, position) => {
          if (position > 0 && entry.value !== order[position - 1].value)
            rank = position + 1;
          ranks[entry.index] = rank;
        });
        return ranks;
      }
      function countRecordsOverMax(tpl) {
        const max = scoreMaximums(tpl);

          SCORE_KEYS.some((k) => typeof r?.[k] === "number" && r[k] > max[k]),
        ).length;
      }
      function runScoringSelfTests() {
        const tpl = {
          components: [15, 15, 15, 15].map((max) => ({ max })),
          internalMax: 60,
          internalWeight: 30,
          examMax: 100,
          examWeight: 70,
        };
        const failures = [];
        let total = 0;
        const check = (name, condition) => {
          total += 1;
          if (!condition) failures.push(name);
        };
        const rec = (it, gw, itk, pw, exam) => ({ it, gw, itk, pw, exam });
        check("template valid", templateIssues(tpl).length === 0);
        check(
          "template weights must total 100",
          templateIssues({ ...tpl, examWeight: 60 }).length > 0,
        );
        [
          ["it", 16],
          ["gw", 16],
          ["itk", 16],
          ["pw", 16],
          ["exam", 101],
        ].forEach(([k, v]) =>
          check(`${k}=${v} rejected`, !validateScoreValue(k, v, tpl).ok),
        );
        [
          ["it", -1],
          ["it", "abc"],
          ["it", "1e3"],
          ["it", "7.555"],
          ["exam", "NaN"],
        ].forEach(([k, v]) =>
          check(`${k}="${v}" rejected`, !validateScoreValue(k, v, tpl).ok),
        );
        [
          ["it", 15],
          ["it", 0],
          ["it", "7.5"],
          ["exam", 100],
          ["exam", 0],
        ].forEach(([k, v]) =>
          check(`${k}=${v} accepted`, validateScoreValue(k, v, tpl).ok),
        );
        check(
          "blank means not entered",
          validateScoreValue("it", "", tpl).value === null,
        );
        const min = verifyCalculation(rec(0, 0, 0, 0, 0), tpl);
        check("minimum totals 0", min.ok && min.calc.finalScore === 0);
        const max = verifyCalculation(rec(15, 15, 15, 15, 100), tpl);
        check(
          "maximum totals 100",
          max.ok &&
            max.calc.finalScore === 100 &&
            max.calc.internalScaled === 30 &&
            max.calc.examScaled === 70,
        );
        const mid = verifyCalculation(rec(15, 13, 11, 14, 72), tpl);
        check(
          "sample totals 76.90",
          mid.ok && fmt(mid.calc.finalScore) === "76.90",
        );
        check(
          "partial record incomplete",
          !verifyCalculation(rec(15, null, 11, 14, 72), tpl).ok,
        );
        check(
          "string record incomplete",
          !verifyCalculation(rec("15", 15, 15, 15, 100), tpl).ok,
        );
        check(
          "over-max stored record incomplete",
          !verifyCalculation(rec(16, 15, 15, 15, 100), tpl).ok,
        );
        check(
          "competition ranks",
          JSON.stringify(competitionRanks([90, 80, 80, 70])) === "[1,2,2,4]",
        );
        check(
          "grade boundary rounding",
          gradeFor(79.995, STATE.gradingScale).grade ===
            gradeFor(80, STATE.gradingScale).grade,
        );
        return {
          total,
          passed: total - failures.length,
          failed: failures.length,
          failures,
        };
      }

      // ---------- Contrast contract (HTML/CSS/JS only) ----------
      // RULE 1: every white / light background or container → BLACK text.
      // RULE 2: every dim / black background → WHITE text.
      // RULE 3: gold colours apply ONLY to dimmed / black backgrounds.
      // The engine walks the DOM, classifies each element's *effective*
      // surface (its own background, otherwise inherited from the nearest
      // painted ancestor), tags it with data-surface and strips any illegal
      // gold ink from light surfaces.
      const CLS_LIGHT_BG = /(^|\s)bg-(?:white(?:\/(?:9[0-5]|100))?|slate-50|slate-100|gray-50|gray-100|grey-50|grey-100|zinc-50|stone-50|neutral-50|brand-50|brand-100|(?:emerald|amber|orange|rose|red|green|sky|blue|indigo|teal|cyan|lime|fuchsia|violet|purple|yellow)-(?:50|100))(\/\d{1,2})?(?=\s|$)/;
      const CLS_DARK_BG  = /(^|\s)bg-(?:black|slate-(?:[6-9]00|950)|gray-(?:[6-9]00|900)|grey-(?:[6-9]00|900)|zinc-(?:[7-9]00)|neutral-(?:[7-9]00)|brand-(?:[6-9]00|950)|(?:emerald|teal|cyan|sky|blue|indigo|violet|purple|fuchsia|rose|red|orange|amber|green)-(?:[5-9]00|900)|gh-green|gh-red|gh-black)(?:\/\d{1,2})?(?=\s|$)/;
      const GOLD_INK_RE  = /(?:^|\s)text-(?:gold|amber|yellow)-(?:[4-6]00|900)(?:\/\d{1,2})?(?=\s|$)|text-gh-gold/;
      const DARK_TEXT_RE = /(?:^|\s)text-(?:slate|gray|grey|zinc|neutral|brand)-(?:[6-9]00|950)(?=\s|$)/;
      const TRANSPARENT_RE = /^rgba?\((\s*0\s*,\s*0\s*,\s*0\s*,\s*0\s*\)|transparent)$/i;

      function rgbStringToArr(rgb) {
        const m = String(rgb).match(/[\d.]+/g);
        if (!m) return null;
        return m.map(Number);
      }
      // Relative luminance (WCAG) of a computed colour string.
      function luminanceOf(rgb) {
        const arr = rgbStringToArr(rgb);
        if (!arr) return null;
        const [r, g, b, a] = arr;
        if (a === 0) return null; // transparent — no information
        const lin = (c) => {
          c /= 255;
          return c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
        };
        return 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);

      // Does this element paint its OWN background (via utility class)?
      function ownBackgroundClass(el) {
        const cls = typeof el.className === "string" ? el.className : "";
        if (!cls) return null;
        if (CLS_LIGHT_BG.test(cls)) return "light";
        if (CLS_DARK_BG.test(cls)) return "dark";
        if (/(^|\s)bg-gradient-to-/.test(cls)) {
          // gradient chips are brand/navy unless they start from a light tone
          return /from-(?:white|slate-(?:50|100|200)|gray-(?:50|100)|brand-(?:50|100|200))/.test(cls) ? "light" : "dark";

      function ownBackgroundComputed(el) {

        const lum = luminanceOf(bg);

      // Hand-marked dark chrome containers (never derived from Tailwind classes).
      function handMarkedDarkAncestor(el) {
        return el.closest(
          '[data-on-dark], .embossed-inset, .hero-banner, [role="dialog"], ' +
          ".glass-rail, .glass-bar, .footer-glass, #search-results-panel, " +
          "#profile-menu, #notifications-panel",
        );

        return ownBackgroundClass(el) || ownBackgroundComputed(el) || null;
      }
      // Effective surface: nearest painted ancestor wins (closest first).
      function resolveSurface(el) {
        if (el.hasAttribute && el.hasAttribute("data-on-dark")) return "dark";
        let node = el;
        while (node && node.nodeType === 1) {
          const own = classifyElement(node);
          if (own === "light") return "light";
          if (own === "dark") return "dark";
          if (own === "mid") return "light"; // mid tones keep black ink (safe default)
          if (node.getAttribute) {
            const tok = node.getAttribute("data-surface");
            if (tok === "light" || tok === "dark") return tok;
          }
          if (node.matches) {
            if (node.matches("[data-on-dark], .embossed-inset, .hero-banner")) return "dark";

          el.setAttribute("data-surface", surface);

          const dur = 900;
          const t0 = performance.now();

          const step = (now) => {
            if (!el.isConnected) return;
            const p = Math.min(1, (now - t0) / dur);
            const eased = 1 - Math.pow(1 - p, 3);
            el.textContent = fmt(Math.round(target * eased));
            if (p < 1) requestAnimationFrame(step);
          };
          requestAnimationFrame(step);
        });
      }

        const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
        const duration = 7000;
        panel.style.setProperty("--hero-ms", `${duration}ms`);
        let current = -1;
        let paused = false;
        const countUp = (node) => {
          const target = Number(node.dataset.count);
          if (!target || reduced) return;
          const start = performance.now();
          const tick = (now) => {
            const t = Math.max(0, Math.min(1, (now - start) / 1200));
            node.textContent =
              Math.round(target * (1 - Math.pow(1 - t, 3))).toLocaleString(
                "en-US",
              ) + (node.dataset.suffix || "");
            if (t < 1 && node.isConnected) requestAnimationFrame(tick);
          };
          requestAnimationFrame(tick);
        };
        const show = (index) => {
          current = (index + slides.length) % slides.length;
          slides.forEach((s, i) =>
            s.classList.toggle("is-active", i === current),
          );
          dots.forEach((d, i) => {
            d.classList.remove("is-active", "is-done");
            d.setAttribute("aria-selected", String(i === current));
            if (i < current) d.classList.add("is-done");
          });
          void panel.offsetWidth;
          dots[current].classList.add("is-active");
          const stat = $("[data-count]", slides[current]);
          if (stat) countUp(stat);
        };
        dots.forEach((d, i) => d.addEventListener("click", () => show(i)));
        const setPaused = (value) => {
          paused = value;
          slot.classList.toggle("hero-paused", value);
        };
        slot.addEventListener("mouseenter", () => setPaused(true));
        slot.addEventListener("mouseleave", () => setPaused(false));
        slot.addEventListener("focusin", () => setPaused(true));
        slot.addEventListener("focusout", () => setPaused(false));
        show(0);
        let elapsed = 0;
        heroTimer = setInterval(() => {
          if (!slot.isConnected) return clearInterval(heroTimer);
          if (paused || document.hidden) return;
          elapsed += 100;
          if (elapsed >= duration) {
            elapsed = 0;
            show(current + 1);
          }
        }, 100);
        dots.forEach((d) => d.addEventListener("click", () => (elapsed = 0)));
      }

      // ---------- School Admin issued logins ----------
      function generatePassword() {
        const chars =
          "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";
        const bytes = crypto.getRandomValues(new Uint8Array(10));
        const password = [...bytes]
          .map((b) => chars[b % chars.length])
          .join("");
        return /[A-Za-z]/.test(password) && /[0-9]/.test(password)
          ? password
          : generatePassword();
      }
      function loginTarget(role, id) {
        if (role === "TEACHER") {
          const t = STATE.teachers.find((item) => item.id === id);
          return (
            t && {
              name: t.name,
              username: (t.email || "").trim().toLowerCase(),
              key: "teacherId",
            }
          );
        }
        const s = STATE.students.find((item) => item.id === id);
        return (
          s && {
            name: [s.firstName, s.middleName, s.lastName]
              .filter(Boolean)
              .join(" "),
            username: (s.admissionNo || "").trim().toLowerCase(),
            key: "studentId",
            inactive: s.status !== "ACTIVE",
          }
        );
      }
      async function issueLogin(role, id) {
        if (STATE.session?.role !== "SCHOOL_ADMIN")
          throw new Error("Only a School Admin can issue logins.");
        const target = loginTarget(role, id);
        if (!target) throw new Error("Record not found.");
        if (!target.username)
          throw new Error(
            `${target.name} needs ${role === "TEACHER" ? "an email address" : "an admission number"} before a login can be issued.`,
          );
        if (target.inactive)
          throw new Error(`${target.name} is not an active learner.`);
        let account = STATE.accounts.find(
          (a) => a.role === role && a[target.key] === id,
        );
        const clash = STATE.accounts.find(
          (a) => a.email === target.username && a !== account,
        );
        if (clash)
          throw new Error(
            `The username ${target.username} is already used by another account.`,
          );
        const password = generatePassword();
        const salt = uid("salt");
        const passwordHash = await hashPassword(password, salt);
        const reset = Boolean(account);
        const school = STATE.schools.find(
          (s) => s.name === STATE.session.school,
        );
        if (!account) {
          account = {
            id: uid("acc"),
            role,
            [target.key]: id,
            schoolId: school?.id || STATE.currentSchoolId,
            createdAt: new Date().toISOString(),
            createdBy: STATE.session.name,
          };
          STATE.accounts.push(account);
        }
        Object.assign(account, {
          email: target.username,
          name: target.name,
          provider: "password",
          salt,
          passwordHash,
          mustChangePassword: true,
        });
        STATE.auditLogs.unshift({
          id: uid("log"),
          user: STATE.session.name,
          action: reset ? "RESET_LOGIN" : "CREATE_LOGIN",
          entity: `account:${role}:${target.username}`,
          at: new Date().toISOString().slice(0, 16).replace("T", " "),
          ip: "127.0.0.1",
        });
        save("state", STATE);
        return {
          name: target.name,
          username: target.username,
          password,
          reset,
        };
      }

              const key = role === "TEACHER" ? "teacherId" : "studentId";
              if (
                STATE.accounts.some((a) => a[key] === id) &&
                !window.confirm(
                  "Reset this login? The old password stops working immediately.",
                )
              )
                return;
              const item = await issueLogin(role, id);
              showCredentialsDialog(
                item.reset ? "Login password reset" : "Login created",
                [item],
              );
            } else {
              const key = role === "TEACHER" ? "teacherId" : "studentId";
              const pool =
                role === "TEACHER"
                  ? STATE.teachers
                  : STATE.students.filter((s) => s.status === "ACTIVE");
              const pending = pool.filter(
                (r) => !STATE.accounts.some((a) => a[key] === r.id),
              );
              const items = [];
              const skipped = [];
              for (const record of pending) {
                try {
                  items.push(await issueLogin(role, record.id));
                } catch (error) {
                  skipped.push(error.message);
                }
              }
              showCredentialsDialog(
                `Generated ${items.length} ${noun} login${items.length === 1 ? "" : "s"}`,
                items,
                skipped,
              );
            }
            refresh();
          } catch (error) {
            toast(error.message);
          }
        });
      }

      async function imageFileToAvatar(file) {
        if (!["image/png", "image/jpeg", "image/webp"].includes(file.type))
          throw new Error("Choose a PNG, JPG or WebP image.");
        if (file.size > 8 * 1024 * 1024)
          throw new Error("The original image must be smaller than 8 MB.");
        const bitmap = await createImageBitmap(file);
        const side = Math.min(bitmap.width, bitmap.height);
        const canvas = document.createElement("canvas");
        canvas.width = canvas.height = Math.min(256, side);
        canvas
          .getContext("2d")
          .drawImage(
            bitmap,
            (bitmap.width - side) / 2,
            (bitmap.height - side) / 2,
            side,
            side,
            0,
            0,
            canvas.width,
            canvas.height,
          );
        bitmap.close();
        return canvas.toDataURL("image/jpeg", 0.85);
      }

          const role = STATE.session.role;
          const matches = [];
          const pushMatch = (label, detail, route, params = {}) =>
            matches.push({ label, detail, route, params });

            STATE.schools

                `${school.name} ${school.code} ${school.address}`
                  .toLocaleLowerCase()
                  .includes(query),

                  school.name,
                  `${school.code} · ${school.subscription.replace(/_/g, " ")}`,
                  "schools",
                ),
              );
          } else if (role === "SCHOOL_ADMIN") {
            STATE.students
              .filter((student) =>
                `${student.firstName} ${student.middleName} ${student.lastName} ${student.admissionNo}`
                  .toLocaleLowerCase()
                  .includes(query),
              )
              .slice(0, 5)
              .forEach((student) =>
                pushMatch(
                  `${student.firstName} ${student.lastName}`,
                  `${student.admissionNo} · ${classLabel(STATE.classes.find((cls) => cls.id === student.classId))}`,
                  "students",
                ),
              );
            STATE.teachers
              .filter((teacher) =>
                `${teacher.name} ${teacher.email}`
                  .toLocaleLowerCase()
                  .includes(query),
              )
              .slice(0, 4)
              .forEach((teacher) =>
                pushMatch(teacher.name, teacher.email, "teachers"),
              );
          } else if (role === "TEACHER") {
            const teacher = STATE.teachers.find(
              (item) => item.id === STATE.session.teacherId,
            );

                (item) => item.id === assignment.classId,
              );
              const subject = STATE.subjects.find(
                (item) => item.id === assignment.subjectId,
              );
              STATE.students

                    student.classId === assignment.classId &&
                    `${student.firstName} ${student.lastName} ${student.studentNo}`

                      .includes(query),
                )
                .forEach((student) =>
                  pushMatch(
                    `${student.firstName} ${student.lastName}`,
                    `${student.studentNo} · ${classLabel(cls)}`,
                    "scores",
                    {
                      classId: assignment.classId,
                      subjectId: assignment.subjectId,
                    },
                  ),
                );

                `${classLabel(cls)} ${subject?.name || ""}`
                  .toLocaleLowerCase()
                  .includes(query)

                  `${classLabel(cls)} · ${subject?.name || ""}`,
                  "Open score entry",
                  "scores",

            const student = STATE.students.find(

                .toLocaleLowerCase()

                "My results",
                "Published assessment results",

            "absolute left-0 right-0 top-full z-40 mt-2 max-h-80 overflow-auto rounded-lg border border-slate-200 bg-white p-1 shadow-xl";
          panel.innerHTML = matches.length
            ? matches
                .map(
                  (match, index) =>
                    `<button type="button" data-search-index="${index}" class="flex w-full flex-col rounded-md px-3 py-2 text-left hover:bg-brand-50"><span class="text-sm font-semibold">${escapeHtml(match.label)}</span><span class="text-xs text-slate-500">${escapeHtml(match.detail)}</span></button>`,
                )

          matches.forEach((match, index) => {
            panel
              .querySelector(`[data-search-index="${index}"]`)
              .addEventListener("click", () => {
                search.value = "";
                panel.remove();
                navigate(match.route, match.params);
              });
          });
          searchWrap.appendChild(panel);
        };
        search?.addEventListener("input", renderSearch);
        search?.addEventListener("keydown", (event) => {

          }
        });
        document.addEventListener("click", (event) => {

        STATE.notifications ||= [];
        const notificationDot = $("#notification-dot");

              .querySelector("[data-mark-all]")

                STATE.notifications.forEach((item) => (item.unread = false));

          });

          render();
          document.body.appendChild(modal);
          document.body.classList.add("overflow-hidden");

            let record = [];

            let quoted = false;
            for (let index = 0; index < source.length; index += 1) {
              const character = source[index];
              if (quoted && character === '"' && source[index + 1] === '"') {
                field += '"';
                index += 1;
              } else if (character === '"') quoted = !quoted;
              else if (character === "," && !quoted) {
                record.push(field);
                field = "";
              } else if (
                (character.charCodeAt(0) === 10 ||
                  character.charCodeAt(0) === 13) &&
                !quoted
              ) {
                if (
                  character.charCodeAt(0) === 13 &&
                  source.charCodeAt(index + 1) === 10
                )
                  index += 1;
                record.push(field);
                records.push(record);
                record = [];

            }
            if (field || record.length) {

mibold disabled:cursor-not-allowed disabled:opacity-50">Import ${validCount} learners</button></div></div></section>`;

          $("[data-results-count]", el).textContent =
            `${rows.length} learners · ${STATE.terms.find((item) => item.id === termSelect.value)?.label || ""}`;
          $("[data-publish-status]", el).textContent = isPublished
            ? "Published to learner accounts"
            : "Not yet published";
          $("[data-publish-results]", el).textContent = isPublished
            ? "Republish Results"
            : "Publish Results";
          $("[data-results-summary]", el).textContent =
            `${classLabel(STATE.classes.find((item) => item.id === classSelect.value))} · ${STATE.subjects.find((item) => item.id === subjectSelect.value)?.name || ""} · ${STATE.terms.find((item) => item.id === termSelect.value)?.label || ""}`;
        };
        [classSelect, subjectSelect, termSelect].forEach((control) =>
          control.addEventListener("change", renderResults),
        );
        $("[data-publish-results]", el).addEventListener("click", () => {
          const key = currentKey();
          const activeStudents = STATE.students.filter(
            (student) =>
              student.classId === classSelect.value &&
              student.status === "ACTIVE",
          );
          const incompleteStudents = activeStudents.filter(
            (student) =>
              !verifyCalculation(
                STATE.scores[
                  `${student.id}|${subjectSelect.value}|${termSelect.value}`
                ],
                STATE.assessmentTemplate,
              ).ok,
          );
          if (!activeStudents.length)
            return toast("This class has no active learners to publish.");
          if (incompleteStudents.length)
            return toast(
              `${incompleteStudents.length} learners have missing or invalid component scores. Complete all five scores before publishing.`,
            );
          const scoredCount = activeStudents.length;
          const dialog = document.createElement("div");
          dialog.className =
            "fixed inset-0 z-50 modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4";
          dialog.innerHTML = `<section role="dialog" aria-modal="true" aria-labelledby="publish-title" class="dialog-enter bg-white w-full sm:max-w-md sm:rounded-xl rounded-t-xl shadow-2xl"><div class="p-5"><div class="flex items-start gap-3"><div class="flex h-10 w-10 shrink-0 items-center justify-center rounded-lg bg-emerald-50 text-xl text-gh-green">✓</div><div><h2 id="publish-title" class="font-bold">Publish assessment results?</h2><p class="mt-1 text-sm text-slate-500">${scoredCount} learners in ${escapeHtml(classLabel(STATE.classes.find((item) => item.id === classSelect.value)))} · ${escapeHtml(STATE.subjects.find((item) => item.id === subjectSelect.value)?.name || "")} · ${escapeHtml(STATE.terms.find((item) => item.id === termSelect.value)?.label || "")} will be able to view their results.</p></div></div><div class="mt-5 flex flex-col-reverse sm:flex-row sm:justify-end gap-2"><button type="button" data-cancel-publish class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold">Cancel</button><button type="button" data-confirm-publish class="edu-action btn-primary rounded-lg px-4 py-2.5 text-sm font-semibold">Confirm publish</button></div></div></section>`;
          const finish = () => {
            dialog.remove();
            document.body.classList.remove("overflow-hidden");
            document.removeEventListener("keydown", onKeyDown);
          };
          const onKeyDown = (event) => {
            if (event.key === "Escape") finish();
          };
          dialog.addEventListener("click", (event) => {
            if (
              event.target === dialog ||
              event.target.closest("[data-cancel-publish]")
            )
              finish();
          });
          document.addEventListener("keydown", onKeyDown);
          $("[data-confirm-publish]", dialog).addEventListener("click", () => {
            const verdict = verifyClassAggregate(
              computeClassResults(
                classSelect.value,
                subjectSelect.value,
                termSelect.value,
                STATE.assessmentTemplate,
                STATE.gradingScale,
              ),
              STATE.assessmentTemplate,
            );
            if (!verdict.ok) {
              finish();
              return reportCalcFailure(
                "publish cross-check",
                new Error(verdict.issues[0]),
              );
            }
            logScoreAudit({
              action: "PUBLISH",
              classId: classSelect.value,
              subjectId: subjectSelect.value,
              termId: termSelect.value,
              detail: "Cross-check passed",
              outputs: verdict.summary,
            });
            STATE.publishedAssessments[key] = true;
            STATE.auditLogs.unshift({
              id: uid("log"),
              user: STATE.session.name,
              action: "PUBLISH",
              entity: `results:${key}`,
              at: new Date().toISOString().slice(0, 16).replace("T", " "),
              ip: "127.0.0.1",
            });
            save("state", STATE);
            finish();
            renderResults();
            toast("Results published to learner accounts");
          });
          document.body.appendChild(dialog);
          document.body.classList.add("overflow-hidden");
          $("[data-confirm-publish]", dialog).focus();
        });
        renderResults();
        return el;
      });

            <div><div class="text-xs text-slate-500">Subject</div><div class="font-semibold">${escapeHtml(sub.name)}</div></div>

          <div class="page-card overflow-hidden">

                      <td class="p-2"><input data-k="gw" aria-label="${escapeHtml(r.student.firstName)} group work" data-max="${tpl.components[1].max}" type="text" inputmode="decimal" autocomplete="off" ${lockState.locked ? "disabled" : ""} class="score-in w-16 text-center input" value="${storedValue(r, "gw")}"></td>
                      <td class="p-2"><input data-k="itk" aria-label="${escapeHtml(r.student.firstName)} individual task" data-max="${tpl.components[2].max}" type="text" inputmode="decimal" autocomplete="off" ${lockState.locked ? "disabled" : ""} class="score-in w-16 text-center input" value="${storedValue(r, "itk")}"></td>
                      <td class="p-2"><input data-k="pw" aria-label="${escapeHtml(r.student.firstName)} project work" data-max="${tpl.components[3].max}" type="text" inputmode="decimal" autocomplete="off" ${lockState.locked ? "disabled" : ""} class="score-in w-16 text-center input" value="${storedValue(r, "pw")}"></td>

        // Strict entry: invalid values are rejected, flagged inline and never persisted.

        const showFeedback = (message) => {
          feedback.textContent = message;
          feedback.classList.toggle("hidden", !message);
        };
        const paintRow = (tr) => {
          const sid = tr.dataset.sid;
          const record = STATE.scores[`${sid}|${subjectId}|${termId}`] || null;
          const set = (cls, text, html = false) => {
            const node = tr.querySelector(cls);
            if (html) node.innerHTML = text;
            else node.textContent = text;
          };
          let verdict = { ok: false, calc: null };
          try {
            verdict = record
              ? verifyCalculation(record, tpl)
              : { ok: false, calc: null };
          } catch (error) {
            reportCalcFailure("live recalculation", error);
          }
          const c = verdict.ok ? verdict.calc : null;
          set(".cell-internal", c ? c.internal : "—");
          set(".cell-internal-scaled", c ? fmt(c.internalScaled) : "—");
          set(".cell-exam-scaled", c ? fmt(c.examScaled) : "—");
          set(".cell-final", c ? fmt(c.finalScore) : "—");
          const g = c ? gradeFor(c.finalScore, scale) : null;
          set(
            ".cell-grade",
            g
              ? `<span class="grade-${g.grade <= 2 ? "A" : g.grade <= 3 ? "B" : g.grade <= 4 ? "C" : "D"}">${g.grade}</span>`
              : "—",
            true,
          );
        };
        const repaintAll = () => {
          const current = computeClassResults(
            classId,
            subjectId,
            termId,
            tpl,
            scale,
          );
          $$("#score-tbody tr", el).forEach((tr, index) => {
            paintRow(tr);
            tr.querySelector(".cell-pos").textContent =
              current[index].position ?? "—";
          });
          const aggregate = verifyClassAggregate(current, tpl);
          if (!aggregate.ok)
            reportCalcFailure(
              "cumulative check",
              new Error(aggregate.issues[0]),
            );
        };
        $$("#score-tbody .score-in", el).forEach((inp) => {
          inp.addEventListener("input", () => {
            const tr = inp.closest("tr");
            const result = persistScoreChange({
              studentId: tr.dataset.sid,
              classId,
              subjectId,
              termId,
              key: inp.dataset.k,
              value: inp.value,
            });
            if (!result.ok) {
              inp.setAttribute("aria-invalid", "true");
              inp.classList.add("border-rose-500", "bg-rose-50");
              inp.dataset.invalid = "true";
              showFeedback(result.error);
              inp.title = result.error;
              [

                "internal-scaled",
                "exam-scaled",
                "final",
                "grade",
                "pos",

                (name) => (tr.querySelector(`.cell-${name}`).textContent = "—"),

            }
            inp.removeAttribute("aria-invalid");
            inp.classList.remove("border-rose-500", "bg-rose-50");
            delete inp.dataset.invalid;
            inp.title = "";
            if (!$$(".score-in[data-invalid]", el).length) showFeedback("");
            try {
              repaintAll();

              reportCalcFailure("recalculation", error);
            }
          });

        $("[data-unlock]", el)?.addEventListener("click", () => {

            !window.confirm(
              "Unlock these scores for editing? Any submission is returned to draft and published results are withdrawn until resubmitted.",

            return;
          const outcome = unlockScoreSet(classId, subjectId, termId);
          if (!outcome.ok) return toast(outcome.error);
          toast("Scores unlocked for editing");

            ...(existing || { id: uid("submission") }),
            key: submissionKey,
            teacherId: teacher.id,
            classId,
            subjectId,
            termId,
            status,
            updatedAt: new Date().toISOString(),
            submittedAt:
              status === "SUBMITTED" ? new Date().toISOString() : null,

            return toast("These scores are already submitted or published.");
          if ($$(".score-in[data-invalid]", el).length)
            return toast(
              "Correct the highlighted invalid scores before submitting.",
            );
          const missing = students.filter(
            (student) =>
              !verifyCalculation(
                STATE.scores[`${student.id}|${subjectId}|${termId}`],
                tpl,
              ).ok,
          );
          if (missing.length)
            return toast(
              `${missing.length} learners still need scores before submission.`,
            );
          const dialog = document.createElement("div");
          dialog.className =
            "fixed inset-0 z-50 modal-backdrop flex items-end sm:items-center justify-center p-0 sm:p-4";
          dialog.innerHTML = `<section role="dialog" aria-modal="true" aria-labelledby="submit-title" class="dialog-enter bg-white w-full sm:max-w-md sm:rounded-xl rounded-t-xl shadow-2xl"><div class="p-5"><h2 id="submit-title" class="font-bold">Submit scores for approval?</h2><p class="mt-1 text-sm text-slate-500">${students.length} learner records for ${escapeHtml(classLabel(cls))} · ${escapeHtml(sub.name)} · ${escapeHtml(STATE.terms.find((term) => term.id === termId)?.label || "Term")}</p><div class="mt-5 flex flex-col-reverse sm:flex-row sm:justify-end gap-2"><button type="button" data-cancel-submit class="rounded-lg border border-slate-200 px-4 py-2.5 text-sm font-semibold">Continue editing</button><button type="button" data-confirm-submit class="edu-action btn-primary rounded-lg px-4 py-2.5 text-sm font-semibold">Submit scores</button></div></div></section>`;
          const close = () => {
            dialog.remove();
            document.body.classList.remove("overflow-hidden");
            document.removeEventListener("keydown", onKey);
          };
          const onKey = (keyEvent) => {
            if (keyEvent.key === "Escape") close();
          };
          dialog.addEventListener("click", (clickEvent) => {
            if (
              clickEvent.target === dialog ||
              clickEvent.target.closest("[data-cancel-submit]")
            )
              close();
          });
          document.addEventListener("keydown", onKey);
          $("[data-confirm-submit]", dialog).addEventListener("click", () => {
            const finalRows = computeClassResults(
              classId,
              subjectId,
              termId,
              tpl,
              scale,
            );
            const aggregate = verifyClassAggregate(finalRows, tpl);
            if (!aggregate.ok) {
              close();
              return reportCalcFailure(
                "submission cross-check",
                new Error(aggregate.issues[0]),
              );
            }
            saveSubmission("SUBMITTED");
            logScoreAudit({
              action: "SUBMIT",
              classId,
              subjectId,
              termId,
              detail: "Cross-check passed",
              outputs: aggregate.summary,
            });
            STATE.auditLogs.unshift({
              id: uid("log"),
              user: STATE.session.name,
              action: "SUBMIT",
              entity: `assessment_scores:${submissionKey}`,
              at: new Date().toISOString().slice(0, 16).replace("T", " "),
              ip: "127.0.0.1",
            });
            save("state", STATE);
            close();
            toast("Scores submitted for approval");
            navigate("scores", { classId, subjectId, termId });
          });
          document.body.appendChild(dialog);
          document.body.classList.add("overflow-hidden");
        });

        return el;
      });

ext-xs text-gh-red" role="alert"></p></section>` : ""}<p data-profile-error class="mt-4 hidden text-sm text-gh-red" role="alert"></p><div class="mt-5 flex justify-end border-t border-slate-100 pt-4"><button type="submit" class="edu-action btn-primary w-full sm:w-auto rounded-lg px-4 py-2.5 text-sm font-semibold">Save profile</button></div></form></section>`;
        if (logoUpload) {
          const fileInput = $("[data-logo-file]", el);
          const removeButton = $("[data-logo-remove]", el);
          const preview = $("[data-logo-preview]", el);
          const error = $("[data-logo-error]", el);
          const renderLogoPreview = () => {
            preview.innerHTML = pendingLogoImage
              ? `<img src="${pendingLogoImage}" alt="School logo preview" class="h-full w-full object-contain" />`
              : `<span class="text-xl font-black text-brand-800">${initials}</span>`;
            removeButton.classList.toggle("hidden", !pendingLogoImage);
          };
          fileInput.addEventListener("change", async () => {
            const file = fileInput.files?.[0];
            error.textContent = "";
            error.classList.add("hidden");
            if (!file) return;
            if (
              !["image/png", "image/jpeg", "image/webp"].includes(file.type)
            ) {
              error.textContent = "Choose a PNG, JPG or WebP image.";
              error.classList.remove("hidden");
              fileInput.value = "";
              return;
            }
            if (file.size > 8 * 1024 * 1024) {
              error.textContent =
                "The original image must be smaller than 8 MB.";
              error.classList.remove("hidden");
              fileInput.value = "";
              return;
            }
            try {
              const bitmap = await createImageBitmap(file);
              const scale = Math.min(
                1,
                512 / Math.max(bitmap.width, bitmap.height),
              );
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, Math.round(bitmap.width * scale));
              canvas.height = Math.max(1, Math.round(bitmap.height * scale));
              canvas
                .getContext("2d")
                .drawImage(bitmap, 0, 0, canvas.width, canvas.height);
              bitmap.close();
              const optimizedImage = canvas.toDataURL("image/jpeg", 0.82);
              if (optimizedImage.length > 450000)
                throw new Error("The optimized image is too large to store.");
              pendingLogoImage = optimizedImage;
              renderLogoPreview();
            } catch (imageError) {
              error.textContent =
                imageError.message ||
                "Unable to process this image. Try a smaller file.";
              error.classList.remove("hidden");
            } finally {
              fileInput.value = "";
            }
          });
          removeButton.addEventListener("click", () => {
            pendingLogoImage = "";
            renderLogoPreview();
          });

          "rounded-xl border border-slate-200 bg-white p-4 sm:p-6";
        photo.innerHTML = `<h3 class="text-sm font-bold">Your profile photo</h3><p class="mt-1 text-xs text-slate-500">Shown next to your name in the top bar. PNG, JPG or WebP; it is cropped square and resized on this device.</p><div class="mt-3 flex flex-col gap-4 sm:flex-row sm:items-center"><div data-avatar-preview class="flex h-24 w-24 shrink-0 items-center justify-center overflow-hidden rounded-full border border-slate-200 bg-brand-100 text-2xl font-black text-brand-800"></div><div class="flex flex-wrap gap-2"><label class="edu-action inline-flex cursor-pointer items-center rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold hover:bg-slate-50">Upload photo<input data-avatar-file type="file" accept="image/png,image/jpeg,image/webp" class="sr-only" /></label><button type="button" data-avatar-remove class="edu-action rounded-lg border border-slate-200 px-3 py-2 text-sm font-semibold text-gh-red hover:bg-rose-50">Remove photo</button></div></div><p data-avatar-error class="mt-2 hidden text-sm text-gh-red" role="alert"></p>`;

          $("[data-avatar-remove]", photo).classList.toggle(
            "hidden",
            !STATE.avatars[userKey()],
          );
          paintUserChrome();
        };
        paintAvatarPreview();
        $("[data-avatar-file]", photo).addEventListener(
          "change",
          async (event) => {
            const input = event.currentTarget;
            const errorNode = $("[data-avatar-error]", photo);
            errorNode.classList.add("hidden");
            const file = input.files?.[0];
            if (!file) return;
            try {
              STATE.avatars[userKey()] = await imageFileToAvatar(file);
              save("state", STATE);
              paintAvatarPreview();
              toast("Profile photo updated");
            } catch (imageError) {
              errorNode.textContent =
                imageError.message || "Unable to use this image.";
              errorNode.classList.remove("hidden");
            } finally {
              input.value = "";
            }
          },
        );
        $("[data-avatar-remove]", photo).addEventListener("click", () => {
          delete STATE.avatars[userKey()];
          save("state", STATE);
          paintAvatarPreview();
          toast("Profile photo removed");
        });
        $("[data-profile-form]", el).addEventListener("submit", (event) => {
          event.preventDefault();
          const updated = Object.fromEntries(
            new FormData(event.currentTarget).entries(),
          );
          if (logoUpload) updated.logoImage = pendingLogoImage;

          if (result?.error) {

            errorNode.textContent = result.error;
            errorNode.classList.remove("hidden");
            return;
          }
          toast(typeof result === "string" ? result : "Profile saved");
        });
        return el;
      }
